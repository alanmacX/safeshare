<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>净享 SafeShare 手机宣传图</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; width: 1080px; height: 1920px; overflow: hidden; }
    body {
      background: #fff;
      color: #111827;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
    }
    .canvas {
      position: relative;
      width: 1080px;
      height: 1920px;
      overflow: hidden;
      background: radial-gradient(circle at 50% 48%, rgba(0,130,103,.055), transparent 46%), #fff;
      isolation: isolate;
    }
    .eyebrow {
      position: absolute;
      z-index: 4;
      top: 82px;
      left: 72px;
      color: #007d65;
      font-size: 24px;
      font-weight: 760;
      letter-spacing: .08em;
    }
    .headline {
      position: absolute;
      z-index: 1;
      top: 244px;
      left: 30px;
      width: 1020px;
      color: #087f68;
      font-size: 104px;
      line-height: 1;
      font-weight: 900;
      letter-spacing: -.06em;
      text-align: center;
      white-space: nowrap;
    }
    .phone-shadow {
      position: absolute;
      z-index: 1;
      left: 50%;
      bottom: 36px;
      width: 650px;
      height: 100px;
      transform: translateX(-50%);
      border-radius: 50%;
      background: rgba(4,68,55,.16);
      filter: blur(42px);
    }
    .phone-crop {
      position: absolute;
      z-index: 2;
      left: 50%;
      top: 320px;
      width: 760px;
      height: 1600px;
      transform: translateX(-50%);
      overflow: hidden;
      filter: drop-shadow(0 30px 34px rgba(13,48,41,.17));
    }
    .phone-crop img,
    .cover-phone img {
      display: block;
      height: auto;
      object-position: left top;
    }
    .phone-crop img { width: 1010px; }
    .cover-phone img { width: 902px; }
    .cover-content { display: none; position: absolute; inset: 0; }
    .cover .eyebrow,
    .cover .headline,
    .cover .phone-shadow,
    .cover > .phone-crop,
    .cover .footer { display: none; }
    .cover .cover-content { display: block; }
    .cover-brand {
      position: absolute;
      z-index: 6;
      top: 116px;
      left: 0;
      width: 100%;
      text-align: center;
    }
    .cover-logo {
      display: block;
      width: 238px;
      height: 238px;
      margin: 0 auto;
      border-radius: 54px;
      box-shadow: 0 28px 72px rgba(0,125,101,.18);
    }
    .cover-name {
      margin-top: 44px;
      color: #101828;
      font-size: 78px;
      line-height: 1;
      font-weight: 900;
      letter-spacing: -.055em;
    }
    .cover-name span {
      margin-left: 15px;
      color: #087f68;
      font-size: .66em;
      font-weight: 790;
      letter-spacing: -.035em;
    }
    .cover-slogan {
      margin-top: 28px;
      color: #087f68;
      font-size: 43px;
      font-weight: 790;
      letter-spacing: -.035em;
    }
    .cover-stage {
      position: absolute;
      z-index: 2;
      left: 0;
      right: 0;
      top: 720px;
      height: 1200px;
    }
    .cover-phone {
      position: absolute;
      width: 680px;
      height: 1390px;
      overflow: hidden;
      filter: drop-shadow(0 30px 42px rgba(13,48,41,.20));
      transform-origin: center top;
    }
    .cover-phone.left {
      left: -12px;
      top: 150px;
      transform: rotate(-4.5deg) scale(.72);
    }
    .cover-phone.right {
      right: -12px;
      top: 76px;
      transform: rotate(4.5deg) scale(.72);
    }
    .cover-fade {
      position: absolute;
      z-index: 5;
      left: 0;
      right: 0;
      top: 0;
      height: 720px;
      background: linear-gradient(#fff 0%, rgba(255,255,255,.98) 58%, rgba(255,255,255,0) 100%);
      pointer-events: none;
    }
  </style>
</head>
<body>
  <main class="canvas">
    <div class="eyebrow">净享 SAFESHARE</div>
    <div class="headline" id="headline"></div>
    <div class="phone-shadow"></div>
    <div class="phone-crop"><img id="shot" alt="净享 SafeShare 功能界面"></div>
    <section class="cover-content">
      <div class="cover-stage">
        <div class="cover-phone left"><img src="/var/folders/zm/kzywknm575q4x5y97tdqbm1h0000gn/T/TemporaryItems/NSIRD_screencaptureui_EqkVaZ/Screenshot 2026-09-08 at 03.09.43.png" alt="净享主页"></div>
        <div class="cover-phone right"><img src="/var/folders/zm/kzywknm575q4x5y97tdqbm1h0000gn/T/TemporaryItems/NSIRD_screencaptureui_oHpfz8/Screenshot 2026-09-08 at 03.05.34.png" alt="文件检查主页"></div>
      </div>
      <div class="cover-fade"></div>
      <div class="cover-brand">
        <img class="cover-logo" src="../../docs/store/app-icon-1024.png" alt="净享 SafeShare 图标">
        <div class="cover-name">净享<span>SafeShare</span></div>
        <div class="cover-slogan">分享之前，先净享</div>
      </div>
    </section>
  </main>
  <script>
    const slides = {
      photo: {
        title: '消除照片隐私数据',
        image: '/var/folders/zm/kzywknm575q4x5y97tdqbm1h0000gn/T/TemporaryItems/NSIRD_screencaptureui_eevqrI/Screenshot 2026-09-08 at 03.05.09.png'
      },
      file: {
        title: '消除文件隐私数据',
        image: '/var/folders/zm/kzywknm575q4x5y97tdqbm1h0000gn/T/TemporaryItems/NSIRD_screencaptureui_saiJny/Screenshot 2026-09-08 at 03.05.54.png'
      }
    };
    const slide = new URLSearchParams(location.search).get('slide') || 'photo';
    if (slide === 'cover') document.querySelector('.canvas').classList.add('cover');
    const data = slides[slide] || slides.photo;
    document.querySelector('#headline').textContent = data.title;
    document.querySelector('#shot').src = data.image;
  </script>
</body>
</html>
