<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>净享 SafeShare Pad 宣传图</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; width: 1920px; height: 1280px; overflow: hidden; }
    body {
      background: #fff;
      color: #101828;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
    }
    .canvas {
      position: relative;
      width: 1920px;
      height: 1280px;
      overflow: hidden;
      background: radial-gradient(circle at 50% 52%, rgba(44,116,255,.055), transparent 44%), #fff;
      isolation: isolate;
    }
    .eyebrow {
      position: absolute;
      z-index: 3;
      top: 54px;
      left: 70px;
      color: #2468e5;
      font-size: 25px;
      font-weight: 750;
      letter-spacing: .08em;
    }
    .headline {
      position: absolute;
      z-index: 1;
      top: 82px;
      left: 50px;
      width: 1820px;
      color: #2468e5;
      font-size: 112px;
      line-height: 1;
      font-weight: 900;
      letter-spacing: -.055em;
      text-align: center;
      white-space: nowrap;
    }
    .pad-shadow {
      position: absolute;
      z-index: 1;
      left: 50%;
      bottom: 22px;
      width: 1480px;
      height: 94px;
      transform: translateX(-50%);
      border-radius: 50%;
      background: rgba(16,36,76,.16);
      filter: blur(40px);
    }
    .pad-crop {
      position: absolute;
      z-index: 2;
      left: 50%;
      bottom: -8px;
      width: 1600px;
      height: 1125px;
      transform: translateX(-50%);
      overflow: hidden;
      filter: drop-shadow(0 26px 32px rgba(19,46,96,.16));
    }
    .pad-crop img {
      display: block;
      width: 1984px;
      height: auto;
      object-position: left top;
    }
    .footer {
      position: absolute;
      z-index: 3;
      right: 58px;
      bottom: 46px;
      color: rgba(36,104,229,.78);
      font-size: 23px;
      font-weight: 700;
      letter-spacing: .04em;
      writing-mode: vertical-rl;
    }
    .cover-content {
      display: none;
      position: absolute;
      inset: 0;
      z-index: 4;
      align-items: center;
      justify-content: center;
      gap: 0;
    }
    .cover .eyebrow,
    .cover .headline,
    .cover .pad-shadow,
    .cover .pad-crop,
    .cover .footer { display: none; }
    .cover .cover-content { display: flex; }
    .cover-logo-wrap {
      width: 370px;
      height: 370px;
      flex: 0 0 auto;
      border-radius: 94px;
      overflow: hidden;
      background: #fff;
      box-shadow: 0 32px 86px rgba(36,104,229,.16);
    }
    .cover-logo { width: 100%; height: 100%; display: block; }
    .cover-copy { margin-left: 94px; }
    .cover-name {
      color: #101828;
      font-size: 108px;
      line-height: 1;
      font-weight: 900;
      letter-spacing: -.055em;
    }
    .cover-en {
      margin-top: 22px;
      color: #2468e5;
      font-size: 38px;
      font-weight: 750;
      letter-spacing: .12em;
    }
    .cover-slogan {
      margin-top: 82px;
      color: #2468e5;
      font-size: 62px;
      font-weight: 800;
      letter-spacing: -.035em;
    }
  </style>
</head>
<body>
  <main class="canvas">
    <div class="eyebrow">净享 SAFESHARE</div>
    <div class="headline" id="headline"></div>
    <div class="pad-shadow"></div>
    <div class="pad-crop"><img id="shot" alt="净享 SafeShare 平板界面"></div>
    <div class="footer">横屏分栏 · 一目了然</div>
    <section class="cover-content">
      <div class="cover-logo-wrap"><img class="cover-logo" src="../../docs/store/app-icon-1024.svg" alt="净享 SafeShare 图标"></div>
      <div class="cover-copy">
        <div class="cover-name">净享</div>
        <div class="cover-en">SAFESHARE</div>
        <div class="cover-slogan">分享之前，先净享</div>
      </div>
    </section>
  </main>
  <script>
    const slides = {
      privacy: {
        title: '消除隐私元数据',
        image: '/var/folders/zm/kzywknm575q4x5y97tdqbm1h0000gn/T/TemporaryItems/NSIRD_screencaptureui_Bf7GMP/Screenshot 2026-09-04 at 02.56.13.png'
      },
      watermark: {
        title: '生成用途水印',
        image: '/var/folders/zm/kzywknm575q4x5y97tdqbm1h0000gn/T/TemporaryItems/NSIRD_screencaptureui_XAnDnD/Screenshot 2026-09-04 at 02.56.47.png'
      }
    };
    const slide = new URLSearchParams(location.search).get('slide') || 'privacy';
    if (slide === 'cover') document.querySelector('.canvas').classList.add('cover');
    const data = slides[slide] || slides.privacy;
    document.querySelector('#headline').textContent = data.title;
    document.querySelector('#shot').src = data.image;
  </script>
</body>
</html>
